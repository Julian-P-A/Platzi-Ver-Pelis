# Usar una base independiente; los cambios de cada prueba se revierten.
spring.datasource.url=${TEST_DB_URL:jdbc:mysql://localhost:3306/ver_pelis_plus_test}
spring.datasource.username=${TEST_DB_USERNAME:verpelis}
spring.datasource.password=${TEST_DB_PASSWORD:}
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.encoding=UTF-8
spring.jpa.hibernate.ddl-auto=validate
verpelis.ai.enabled=false

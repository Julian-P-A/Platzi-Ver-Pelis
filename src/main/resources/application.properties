spring.application.name=Ver Pelis plus
spring.profiles.default=dev
server.address=${SERVER_ADDRESS:127.0.0.1}
server.servlet.context-path=/ver-pelis-plus/api

# MySQL es la base de datos en todos los perfiles.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ver_pelis_plus}
spring.datasource.username=${DB_USERNAME:verpelis}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# El saludo local no requiere servicios externos. La IA es opcional.
verpelis.ai.enabled=${AI_ENABLED:false}
verpelis.ai.api-key=${OPENAI_API_KEY:}
verpelis.ai.model=${OPENAI_MODEL:gpt-4o-mini}

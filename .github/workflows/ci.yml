name: API tests with MySQL
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: ver_pelis_plus_test
          MYSQL_USER: verpelis
          MYSQL_PASSWORD: test-only-password
          MYSQL_ROOT_PASSWORD: test-only-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    env:
      TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/ver_pelis_plus_test
      TEST_DB_USERNAME: verpelis
      TEST_DB_PASSWORD: test-only-password
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: ./mvnw -B package
      - run: ./mvnw -B -Dtest=MySqlIntegrationIT test
